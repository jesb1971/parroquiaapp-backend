
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Noticias | Parroquia Cruz del Señor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .texto-noticia {
        white-space: pre-line;
        overflow-wrap: anywhere;
        line-height: 1.7;
    }

    #contenido {
        min-height: 180px;
    }

    .imagen-previa {
        max-height: 250px;
        max-width: 100%;
        object-fit: contain;
    }

    .miniatura {
        width: 85px;
        height: 85px;
        object-fit: cover;
        border-radius: 8px;
    }
</style>
</head>

<body class="bg-light">

<div class="container py-4" style="max-width: 850px;">

    <h2 class="mb-4 text-center">📰 Gestión de Noticias</h2>

    <!-- FORMULARIO -->
    <div class="card mb-4">
        <div class="card-body">

            <h5 id="tituloFormulario" class="mb-3">
                Crear Noticia
            </h5>

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <form id="formularioNoticia">

                <!-- TÍTULO -->
                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Título
                    </label>
                    <input type="text"
                           id="titulo"
                           class="form-control"
                           placeholder="Título de la noticia"
                           required>
                </div>

                <!-- CONTENIDO -->
                <div class="mb-3">
                    <label for="contenido" class="form-label">
                        Contenido
                    </label>
                    <textarea id="contenido"
                              class="form-control"
                              rows="8"
                              placeholder="Escribe el contenido de la noticia"
                              required></textarea>
                </div>

                <!-- IMAGEN ACTUAL -->
                <div id="bloqueImagenActual" class="mb-3 d-none">
                    <label class="form-label">Imagen actual</label>
                    <div>
                        <img id="imagenActual"
                             class="imagen-previa rounded border"
                             alt="Imagen actual de la noticia">
                    </div>
                </div>

                <!-- SELECCIONAR IMAGEN -->
                <div class="mb-3">
                    <label for="imagenArchivo" class="form-label">
                        Imagen de la noticia
                    </label>

                    <input type="file"
                           id="imagenArchivo"
                           class="form-control"
                           accept="image/jpeg,image/png,image/webp">

                    <div class="form-text">
                        Selecciona una imagen JPG, PNG o WebP (máximo 5 MB).
                    </div>

                    <img id="imagenPrevia"
                         alt="Vista previa de la imagen seleccionada"
                         class="imagen-previa rounded border mt-3 d-none">
                </div>

                <!-- URL EXTERNA -->
                <div class="mb-4">
                    <label for="imagenURL" class="form-label">
                        URL de imagen (opcional)
                    </label>

                    <input type="url"
                           id="imagenURL"
                           class="form-control"
                           placeholder="https://...">

                    <div class="form-text">
                        Puedes utilizar una imagen externa si no seleccionas un archivo.
                    </div>
                </div>

                <!-- BOTONES -->
                <button id="botonGuardar"
                        type="submit"
                        class="btn btn-primary w-100">
                    Crear Noticia
                </button>

                <button id="botonCancelar"
                        type="button"
                        class="btn btn-outline-secondary w-100 mt-2 d-none">
                    Cancelar edición
                </button>

            </form>

        </div>
    </div>

    <!-- LISTADO -->
    <div class="card">
        <div class="card-body">

            <h5 class="mb-3">Listado de Noticias</h5>

            <div id="listaNoticias" class="list-group"></div>

        </div>
    </div>

    <div class="mt-4 text-center">
        <a href="/admin" class="btn btn-secondary">
            ← Volver
        </a>
    </div>

</div>

<script>
const API_URL = "/noticias/";

const formulario = document.getElementById("formularioNoticia");
const tituloInput = document.getElementById("titulo");
const contenidoInput = document.getElementById("contenido");
const imagenArchivo = document.getElementById("imagenArchivo");
const imagenURL = document.getElementById("imagenURL");
const imagenPrevia = document.getElementById("imagenPrevia");
const imagenActual = document.getElementById("imagenActual");
const bloqueImagenActual = document.getElementById("bloqueImagenActual");
const botonGuardar = document.getElementById("botonGuardar");
const botonCancelar = document.getElementById("botonCancelar");
const tituloFormulario = document.getElementById("tituloFormulario");
const mensaje = document.getElementById("mensaje");

let noticiasActuales = [];
let noticiaEnEdicion = null;
let guardando = false;
let urlPrevia = null;


function mostrarMensaje(texto, tipo = "success") {
    mensaje.className = "alert alert-" + tipo;
    mensaje.textContent = texto;
}


function ocultarMensaje() {
    mensaje.className = "alert d-none";
    mensaje.textContent = "";
}


function limpiarPrevia() {
    if (urlPrevia) {
        URL.revokeObjectURL(urlPrevia);
        urlPrevia = null;
    }

    imagenPrevia.removeAttribute("src");
    imagenPrevia.classList.add("d-none");
}


imagenArchivo.addEventListener("change", function () {
    limpiarPrevia();

    const archivo = this.files[0];

    if (!archivo) return;

    const formatos = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (
        !formatos.includes(archivo.type) ||
        archivo.size > 5 * 1024 * 1024
    ) {
        mostrarMensaje(
            "Selecciona una imagen JPG, PNG o WebP de hasta 5 MB.",
            "warning"
        );

        this.value = "";
        return;
    }

    urlPrevia = URL.createObjectURL(archivo);
    imagenPrevia.src = urlPrevia;
    imagenPrevia.classList.remove("d-none");
});


async function cargarNoticias() {
    const lista = document.getElementById("listaNoticias");

    try {
        const res = await fetch(API_URL);

        if (!res.ok) {
            throw new Error("Error al cargar noticias");
        }

        noticiasActuales = await res.json();
        lista.replaceChildren();

        if (noticiasActuales.length === 0) {
            const vacio = document.createElement("p");
            vacio.className = "text-muted mb-0";
            vacio.textContent = "No hay noticias publicadas.";
            lista.appendChild(vacio);
            return;
        }

        noticiasActuales.forEach(noticia => {

            const elemento = document.createElement("div");
            elemento.className = "list-group-item p-3";

            const fila = document.createElement("div");
            fila.className = "d-flex gap-3 align-items-start";

            if (noticia.imagen) {
                const imagen = document.createElement("img");
                imagen.src = noticia.imagen;
                imagen.alt = "";
                imagen.className = "miniatura flex-shrink-0";
                fila.appendChild(imagen);
            }

            const informacion = document.createElement("div");
            informacion.className = "flex-grow-1";

            const titulo = document.createElement("h6");
            titulo.className = "fw-bold text-primary mb-2";
            titulo.textContent = noticia.titulo || "Noticia";

            const contenido = document.createElement("p");
            contenido.className = "texto-noticia text-secondary mb-2";
            contenido.textContent = noticia.contenido || "";

            const fecha = document.createElement("small");
            fecha.className = "text-muted d-block mb-3";

            if (noticia.fecha) {
                const fechaNoticia = new Date(noticia.fecha);

                if (!Number.isNaN(fechaNoticia.getTime())) {
                    fecha.textContent = fechaNoticia.toLocaleString("es-ES");
                }
            }

            informacion.appendChild(titulo);
            informacion.appendChild(contenido);
            informacion.appendChild(fecha);

            fila.appendChild(informacion);
            elemento.appendChild(fila);

            const controles = document.createElement("div");
            controles.className = "d-flex gap-2 mt-3";

            const editar = document.createElement("button");
            editar.type = "button";
            editar.className = "btn btn-sm btn-primary flex-fill";
            editar.textContent = "✏️ Editar";
            editar.addEventListener("click", () => iniciarEdicion(noticia.id));

            const eliminar = document.createElement("button");
            eliminar.type = "button";
            eliminar.className = "btn btn-sm btn-danger flex-fill";
            eliminar.textContent = "🗑 Eliminar";
            eliminar.addEventListener("click", () => eliminarNoticia(noticia.id));

            controles.appendChild(editar);
            controles.appendChild(eliminar);
            elemento.appendChild(controles);

            lista.appendChild(elemento);
        });

    } catch (error) {
        console.error(error);
        mostrarMensaje(
            "No se pudieron cargar las noticias.",
            "danger"
        );
    }
}


function iniciarEdicion(id) {
    const noticia = noticiasActuales.find(
        elemento => elemento.id === id
    );

    if (!noticia) {
        mostrarMensaje("No se encontró la noticia.", "danger");
        return;
    }

    noticiaEnEdicion = id;

    tituloInput.value = noticia.titulo || "";
    contenidoInput.value = noticia.contenido || "";

    imagenArchivo.value = "";
    limpiarPrevia();

    imagenURL.value = "";

    if (noticia.imagen) {
        imagenActual.src = noticia.imagen;
        bloqueImagenActual.classList.remove("d-none");
    } else {
        imagenActual.removeAttribute("src");
        bloqueImagenActual.classList.add("d-none");
    }

    tituloFormulario.textContent = "Editar Noticia";
    botonGuardar.textContent = "Guardar cambios";
    botonCancelar.classList.remove("d-none");

    ocultarMensaje();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    tituloInput.focus();
}


function cancelarEdicion() {
    noticiaEnEdicion = null;

    formulario.reset();
    limpiarPrevia();

    imagenActual.removeAttribute("src");
    bloqueImagenActual.classList.add("d-none");

    tituloFormulario.textContent = "Crear Noticia";
    botonGuardar.textContent = "Crear Noticia";
    botonCancelar.classList.add("d-none");

    ocultarMensaje();
}


botonCancelar.addEventListener("click", cancelarEdicion);


formulario.addEventListener("submit", async function (evento) {
    evento.preventDefault();

    if (guardando) return;

    const titulo = tituloInput.value.trim();
    const contenido = contenidoInput.value.trim();

    if (!titulo || !contenido) {
        mostrarMensaje(
            "Debes completar el título y el contenido.",
            "warning"
        );
        return;
    }

    const editando = noticiaEnEdicion !== null;

    const datos = new FormData();
    datos.append("titulo", titulo);
    datos.append("contenido", contenido);
    datos.append("imagen_url", imagenURL.value.trim());

    if (imagenArchivo.files.length > 0) {
        datos.append("imagen", imagenArchivo.files[0]);
    }

    const url = editando
        ? API_URL + noticiaEnEdicion
        : API_URL + "publicar";

    const metodo = editando ? "PUT" : "POST";

    guardando = true;
    botonGuardar.disabled = true;

    try {
        const res = await fetch(url, {
            method: metodo,
            body: datos
        });

        if (!res.ok) {
            throw new Error("Error al guardar noticia");
        }

        cancelarEdicion();
        await cargarNoticias();

        mostrarMensaje(
            editando
                ? "Noticia actualizada correctamente."
                : "Noticia publicada correctamente.",
            "success"
        );

    } catch (error) {
        console.error(error);

        mostrarMensaje(
            "No se pudo guardar la noticia.",
            "danger"
        );

    } finally {
        guardando = false;
        botonGuardar.disabled = false;
    }
});


async function eliminarNoticia(id) {
    const noticia = noticiasActuales.find(
        elemento => elemento.id === id
    );

    if (!noticia) return;

    const confirmado = confirm(
        "¿Seguro que deseas eliminar esta noticia?\n\n" +
        noticia.titulo
    );

    if (!confirmado) return;

    try {
        const res = await fetch(API_URL + id, {
            method: "DELETE"
        });

        if (!res.ok) {
            throw new Error("Error al eliminar noticia");
        }

        if (noticiaEnEdicion === id) {
            cancelarEdicion();
        }

        await cargarNoticias();

        mostrarMensaje(
            "Noticia eliminada correctamente.",
            "success"
        );

    } catch (error) {
        console.error(error);

        mostrarMensaje(
            "No se pudo eliminar la noticia.",
            "danger"
        );
    }
}


cargarNoticias();
</script>

</body>
</html>
