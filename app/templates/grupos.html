<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupos parroquiales | Parroquia Cruz del Señor</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<div class="max-w-2xl mx-auto min-h-screen bg-white shadow-sm">

    <!-- CABECERA -->
    <header class="bg-blue-700 text-white px-4 py-4">
        <a href="/menu"
           class="inline-block bg-white text-blue-700 px-3 py-2 rounded-lg text-sm font-semibold">
            ← Volver al menú
        </a>
    </header>

    <!-- PRESENTACIÓN -->
    <main class="px-5 py-8">

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-800 mb-4">
                Grupos parroquiales
            </h1>

            <p class="text-gray-600 leading-relaxed">
                Nuestra parroquia es una comunidad viva,
                enriquecida por los grupos apostólicos que
                comparten su fe, su tiempo y su servicio
                a los demás.
            </p>
        </div>

        <div id="categorias" class="space-y-6">
            <p class="text-center text-gray-500">
                Cargando grupos parroquiales...
            </p>
        </div>

    </main>

    <footer class="text-center text-xs text-gray-500 py-6 px-4 border-t">
        Parroquia Cruz del Señor
    </footer>

</div>

<script>
async function cargarGrupos() {
    const contenedor = document.getElementById("categorias");

    try {
        const respuesta = await fetch("/api/grupos/");

        if (!respuesta.ok) {
            throw new Error("Error al consultar los grupos");
        }

        const datos = await respuesta.json();

        contenedor.replaceChildren();

        datos.categorias.forEach(categoria => {
            const seccion = document.createElement("section");
            seccion.className =
                "bg-blue-50 border border-blue-100 rounded-2xl p-5";

            const titulo = document.createElement("h2");
            titulo.className =
                "text-lg font-bold text-blue-800 mb-4";
            titulo.textContent = categoria;

            seccion.appendChild(titulo);

            const grupos = datos.grupos.filter(
                grupo => grupo.categoria === categoria
            );

            if (grupos.length === 0) {
                const aviso = document.createElement("p");
                aviso.className = "text-sm text-gray-500";
                aviso.textContent =
                    "Próximamente incorporaremos información.";
                seccion.appendChild(aviso);
            }

            grupos.forEach(grupo => {
                const enlace = document.createElement("a");
                enlace.href = "/grupo/" + grupo.id;
                enlace.className =
                    "block bg-white border border-blue-100 " +
                    "rounded-xl px-4 py-3 mb-2 " +
                    "text-blue-800 font-medium " +
                    "hover:bg-blue-100 transition";

                enlace.textContent = grupo.nombre + " →";
                seccion.appendChild(enlace);
            });

            contenedor.appendChild(seccion);
        });

    } catch (error) {
        contenedor.textContent =
            "No se pudieron cargar los grupos parroquiales.";
        contenedor.className =
            "text-center text-red-600 py-6";
    }
}

document.addEventListener("DOMContentLoaded", cargarGrupos);
</script>

</body>
</html>
