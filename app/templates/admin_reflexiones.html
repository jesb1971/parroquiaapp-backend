
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Reflexiones Dominicales | Parroquia Cruz del Señor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
        }

        .contenedor {
            max-width: 850px;
        }

        .texto-reflexion {
            white-space: pre-line;
            overflow-wrap: anywhere;
            line-height: 1.7;
        }

        .miniatura {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
        }

        .imagen-previa {
            max-width: 100%;
            max-height: 240px;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div class="container contenedor py-4">

    <h2 class="text-center text-primary mb-4">
        📖 Gestión de Reflexiones Dominicales
    </h2>

    <!-- FORMULARIO -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h5 id="tituloFormulario" class="mb-3">
                Publicar reflexión dominical
            </h5>

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <form id="formularioReflexion">

                <div class="mb-3">
                    <label for="fechaDomingo" class="form-label">
                        Fecha del domingo
                    </label>
                    <input type="date" id="fechaDomingo"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Título
                    </label>
                    <input type="text" id="titulo"
                           class="form-control"
                           maxlength="200" required>
                </div>

                <div class="mb-3">
                    <label for="subtitulo" class="form-label">
                        Subtítulo (opcional)
                    </label>
                    <input type="text" id="subtitulo"
                           class="form-control" maxlength="300">
                </div>

                <div class="mb-3">
                    <label for="contenido" class="form-label">
                        Reflexión completa
                    </label>
                    <textarea id="contenido" class="form-control"
                              rows="10" required></textarea>
                </div>

                <div class="mb-4">
                    <label for="imagen" class="form-label">
                        URL de la imagen (opcional)
                    </label>
                    <input type="url" id="imagen"
                           class="form-control"
                           placeholder="https://...">

                    <div class="form-text">
                        Introduce la dirección pública de una imagen.
                    </div>

                    <img id="imagenPrevia"
                         class="imagen-previa rounded mt-3 d-none"
                         alt="Vista previa">
                </div>

                <button id="botonGuardar" type="submit"
                        class="btn btn-primary w-100">
                    Publicar reflexión
                </button>

                <button id="botonCancelar" type="button"
                        class="btn btn-outline-secondary w-100 mt-2 d-none">
                    Cancelar edición
                </button>

            </form>
        </div>
    </div>

    <!-- HISTORIAL -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3">Historial de reflexiones</h5>
            <div id="listaReflexiones" class="list-group"></div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/admin" class="btn btn-secondary">
            ← Volver al panel
        </a>
    </div>

</div>

<script>
const API_URL = "/reflexiones-dominicales/";

const formulario = document.getElementById("formularioReflexion");
const fechaInput = document.getElementById("fechaDomingo");
const tituloInput = document.getElementById("titulo");
const subtituloInput = document.getElementById("subtitulo");
const contenidoInput = document.getElementById("contenido");
const imagenInput = document.getElementById("imagen");
const imagenPrevia = document.getElementById("imagenPrevia");
const botonGuardar = document.getElementById("botonGuardar");
const botonCancelar = document.getElementById("botonCancelar");
const tituloFormulario = document.getElementById("tituloFormulario");
const mensaje = document.getElementById("mensaje");
const listaReflexiones = document.getElementById("listaReflexiones");

let reflexionesActuales = [];
let reflexionEnEdicion = null;
let guardando = false;

function mostrarMensaje(texto, tipo = "success") {
    mensaje.className = "alert alert-" + tipo;
    mensaje.textContent = texto;
}

function limpiarFormulario() {
    formulario.reset();
    reflexionEnEdicion = null;
    imagenPrevia.classList.add("d-none");
    imagenPrevia.removeAttribute("src");
    tituloFormulario.textContent = "Publicar reflexión dominical";
    botonGuardar.textContent = "Publicar reflexión";
    botonCancelar.classList.add("d-none");
}

function formatearFecha(fecha) {
    if (!fecha) return "";

    const partes = fecha.split("-");
    const fechaLocal = new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

    return fechaLocal.toLocaleDateString("es-ES", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

imagenInput.addEventListener("input", function () {
    const url = imagenInput.value.trim();

    if (url) {
        imagenPrevia.src = url;
        imagenPrevia.classList.remove("d-none");
    } else {
        imagenPrevia.removeAttribute("src");
        imagenPrevia.classList.add("d-none");
    }
});

async function cargarReflexiones() {
    try {
        const respuesta = await fetch(API_URL);

        if (!respuesta.ok) {
            throw new Error("No se pudieron cargar las reflexiones.");
        }

        reflexionesActuales = await respuesta.json();
        listaReflexiones.replaceChildren();

        if (reflexionesActuales.length === 0) {
            const vacio = document.createElement("p");
            vacio.className = "text-muted";
            vacio.textContent = "Todavía no hay reflexiones publicadas.";
            listaReflexiones.appendChild(vacio);
            return;
        }

        reflexionesActuales.forEach(function (reflexion) {

            const elemento = document.createElement("div");
            elemento.className = "list-group-item p-3";

            const titulo = document.createElement("h6");
            titulo.className = "fw-bold text-primary";
            titulo.textContent = reflexion.titulo;

            const fecha = document.createElement("small");
            fecha.className = "text-muted d-block mb-2";
            fecha.textContent = formatearFecha(
                reflexion.fecha_domingo
            );

            const contenido = document.createElement("p");
            contenido.className = "texto-reflexion text-secondary";
            contenido.textContent = reflexion.contenido;

            const controles = document.createElement("div");
            controles.className = "d-flex gap-2 mt-3";

            const editar = document.createElement("button");
            editar.type = "button";
            editar.className = "btn btn-sm btn-primary flex-fill";
            editar.textContent = "✏️ Editar";
            editar.addEventListener("click", function () {
                iniciarEdicion(reflexion.id);
            });

            const eliminar = document.createElement("button");
            eliminar.type = "button";
            eliminar.className = "btn btn-sm btn-danger flex-fill";
            eliminar.textContent = "🗑 Eliminar";
            eliminar.addEventListener("click", function () {
                eliminarReflexion(reflexion.id);
            });

            controles.appendChild(editar);
            controles.appendChild(eliminar);

            elemento.appendChild(titulo);
            elemento.appendChild(fecha);
            elemento.appendChild(contenido);
            elemento.appendChild(controles);

            listaReflexiones.appendChild(elemento);
        });

    } catch (error) {
        console.error(error);
        mostrarMensaje(
            "No se pudo cargar el historial.",
            "danger"
        );
    }
}

function iniciarEdicion(id) {
    const reflexion = reflexionesActuales.find(
        elemento => elemento.id === id
    );

    if (!reflexion) return;

    reflexionEnEdicion = id;
    fechaInput.value = reflexion.fecha_domingo;
    tituloInput.value = reflexion.titulo || "";
    subtituloInput.value = reflexion.subtitulo || "";
    contenidoInput.value = reflexion.contenido || "";
    imagenInput.value = reflexion.imagen || "";

    imagenInput.dispatchEvent(new Event("input"));

    tituloFormulario.textContent = "Editar reflexión dominical";
    botonGuardar.textContent = "Guardar cambios";
    botonCancelar.classList.remove("d-none");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

botonCancelar.addEventListener("click", limpiarFormulario);

formulario.addEventListener("submit", async function (evento) {
    evento.preventDefault();

    if (guardando) return;

    const datos = {
        fecha_domingo: fechaInput.value,
        titulo: tituloInput.value.trim(),
        subtitulo: subtituloInput.value.trim() || null,
        contenido: contenidoInput.value.trim(),
        imagen: imagenInput.value.trim() || null
    };

    if (!datos.fecha_domingo || !datos.titulo || !datos.contenido) {
        mostrarMensaje(
            "Completa los campos obligatorios.",
            "warning"
        );
        return;
    }

    const editando = reflexionEnEdicion !== null;
    const url = editando
        ? API_URL + reflexionEnEdicion
        : API_URL;

    guardando = true;
    botonGuardar.disabled = true;

    try {
        const respuesta = await fetch(url, {
            method: editando ? "PUT" : "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        });

        if (!respuesta.ok) {
            throw new Error("No se pudo guardar la reflexión.");
        }

        limpiarFormulario();
        await cargarReflexiones();

        mostrarMensaje(
            editando
                ? "Reflexión actualizada correctamente."
                : "Reflexión publicada correctamente."
        );

    } catch (error) {
        console.error(error);
        mostrarMensaje(
            "No se pudo guardar la reflexión.",
            "danger"
        );
    } finally {
        guardando = false;
        botonGuardar.disabled = false;
    }
});

async function eliminarReflexion(id) {
    const reflexion = reflexionesActuales.find(
        elemento => elemento.id === id
    );

    if (!reflexion) return;

    const confirmado = confirm(
        "¿Seguro que deseas eliminar esta reflexión?\n\n" +
        reflexion.titulo
    );

    if (!confirmado) return;

    try {
        const respuesta = await fetch(API_URL + id, {
            method: "DELETE"
        });

        if (!respuesta.ok) {
            throw new Error("No se pudo eliminar.");
        }

        if (reflexionEnEdicion === id) {
            limpiarFormulario();
        }

        await cargarReflexiones();
        mostrarMensaje("Reflexión eliminada correctamente.");

    } catch (error) {
        console.error(error);
        mostrarMensaje(
            "No se pudo eliminar la reflexión.",
            "danger"
        );
    }
}

cargarReflexiones();
</script>

</body>
</html>
