<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oración del día — Parroquia Cruz del Señor</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 text-gray-800 min-h-screen">

    <main class="max-w-3xl mx-auto px-4 py-6">

        <!-- CABECERA -->
        <header class="bg-white rounded-xl shadow p-5 mb-5">

            <h1 class="text-2xl font-bold text-blue-700">
                🙏 Oración del día
            </h1>

            <p class="text-gray-600 text-sm mt-2">
                Un momento de encuentro con Dios,
                de reflexión y esperanza.
            </p>

            <a href="/menu"
               class="inline-block mt-4 bg-blue-100 text-blue-700
                      px-4 py-2 rounded-lg font-semibold">
                ← Volver al menú
            </a>

        </header>

        <!-- CONTENIDO DE LA ORACIÓN -->
        <section id="contenedor-oracion"
                 class="bg-white rounded-xl shadow p-5">

            <p class="text-center text-gray-500">
                Cargando la oración del día...
            </p>

        </section>

        <!-- HISTÓRICO -->
        <div class="text-center mt-6">

            <a href="/oraciones/historico-vista"
               class="inline-block bg-blue-600 text-white
                      px-5 py-3 rounded-lg hover:bg-blue-700">
                📖 Consultar oraciones anteriores
            </a>

        </div>

    </main>

    <script>
        async function cargarOracion() {

            const contenedor =
                document.getElementById("contenedor-oracion");

            try {
                const respuesta = await fetch("/oraciones/hoy");

                if (!respuesta.ok) {
                    throw new Error("No hay oración disponible");
                }

                const oracion = await respuesta.json();

                contenedor.replaceChildren();

                if (oracion.imagen) {
                    const imagen = document.createElement("img");
                    imagen.src = oracion.imagen;
                    imagen.alt = "Imagen de la oración";
                    imagen.className =
                        "w-full max-h-96 object-contain rounded-lg mb-5";
                    contenedor.appendChild(imagen);
                }

                const fecha = document.createElement("p");
                fecha.className = "text-sm text-gray-500 mb-2";
                fecha.textContent = new Date(
                    oracion.fecha + "T12:00:00"
                ).toLocaleDateString("es-ES", {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
                contenedor.appendChild(fecha);

                const titulo = document.createElement("h2");
                titulo.className =
                    "text-xl font-bold text-blue-700 mb-4";
                titulo.textContent = oracion.titulo;
                contenedor.appendChild(titulo);

                const contenido = document.createElement("p");
                contenido.className =
                    "text-gray-700 leading-relaxed whitespace-pre-line";
                contenido.textContent = oracion.contenido;
                contenedor.appendChild(contenido);

                if (oracion.autor) {
                    const autor = document.createElement("p");
                    autor.className =
                        "text-right italic text-gray-500 mt-5";
                    autor.textContent = oracion.autor;
                    contenedor.appendChild(autor);
                }

            } catch (error) {
                contenedor.textContent =
                    "Todavía no hay oraciones publicadas.";
            }
        }

        cargarOracion();
    </script>

</body>
</html>
