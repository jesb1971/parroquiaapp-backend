
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Donativos — Parroquia Cruz del Señor</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<main class="container py-4" style="max-width: 750px;">

    <h2 class="text-center mb-4">💙 Gestionar Donativos</h2>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form method="post" action="/admin/donativos">

                <!-- Protección CSRF -->
                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token }}">

                <input type="hidden"
                       name="csrf_firma"
                       value="{{ csrf_firma }}">

                <!-- Código Bizum -->
                <div class="mb-3">
                    <label for="bizum_codigo" class="form-label">
                        Código Bizum
                    </label>

                    <input type="text"
                           id="bizum_codigo"
                           name="bizum_codigo"
                           class="form-control"
                           value="{{ configuracion.bizum_codigo }}"
                           maxlength="5"
                           pattern="[0-9]{5}"
                           inputmode="numeric"
                           required>

                    <div class="form-text">
                        Introduce los cinco dígitos del código Bizum.
                    </div>
                </div>

                <!-- Enlace oficial -->
                <div class="mb-3">
                    <label for="donativo_url" class="form-label">
                        Enlace de donación online
                    </label>

                    <input type="url"
                           id="donativo_url"
                           name="donativo_url"
                           class="form-control"
                           value="{{ configuracion.donativo_url }}"
                           required>

                    <div class="form-text">
                        Enlace oficial de Dono a mi Iglesia.
                    </div>
                </div>

                <!-- Mensaje informativo -->
                <div class="mb-3">
                    <label for="mensaje_informativo" class="form-label">
                        Mensaje informativo
                    </label>

                    <textarea id="mensaje_informativo"
                              name="mensaje_informativo"
                              class="form-control"
                              rows="3"
                              maxlength="2000"
                              required>{{ configuracion.mensaje_informativo }}</textarea>
                </div>

                <!-- Mensaje de agradecimiento -->
                <div class="mb-3">
                    <label for="mensaje_agradecimiento" class="form-label">
                        Mensaje de agradecimiento
                    </label>

                    <textarea id="mensaje_agradecimiento"
                              name="mensaje_agradecimiento"
                              class="form-control"
                              rows="3"
                              maxlength="2000"
                              required>{{ configuracion.mensaje_agradecimiento }}</textarea>
                </div>

                <!-- Estado del módulo -->
                <div class="form-check form-switch mb-4">
                    <input type="checkbox"
                           id="activo"
                           name="activo"
                           value="true"
                           class="form-check-input"
                           {% if configuracion.activo %}checked{% endif %}>

                    <label for="activo" class="form-check-label">
                        Módulo Donativos activo
                    </label>
                </div>

                <!-- Guardar -->
                <button type="submit" class="btn btn-primary w-100">
                    Guardar configuración
                </button>

            </form>

        </div>
    </div>

    <!-- Volver al panel -->
    <div class="text-center mt-4">
        <a href="/admin" class="btn btn-outline-secondary">
            ← Volver al panel de administración
        </a>
    </div>

</main>

</body>
</html>
