<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrar Evangelización</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-2xl mx-auto p-4">

    <!-- CABECERA -->
    <div class="bg-blue-700 text-white p-4 rounded-2xl mb-6 flex justify-between items-center">

        <a href="/admin"
           class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">
            ← Volver
        </a>

        <h1 class="text-xl font-bold">
            Evangelización
        </h1>

    </div>

    <!-- FORMULARIO -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">

        <form method="POST" action="/admin/evangelizacion/crear">

            <div class="mb-4">
                <label class="font-semibold">Título</label>
                <input type="text"
                       name="titulo"
                       class="w-full border rounded-lg p-3"
                       required>
            </div>

            <div class="mb-4">
                <label class="font-semibold">Cita bíblica</label>
                <input type="text"
                       name="cita_biblica"
                       class="w-full border rounded-lg p-3">
            </div>

            <div class="mb-4">
                <label class="font-semibold">Reflexión</label>
                <textarea name="reflexion"
                          rows="6"
                          class="w-full border rounded-lg p-3"
                          required></textarea>
            </div>

            <div class="mb-4">
                <label class="font-semibold">Pregunta final</label>
                <textarea name="pregunta_reflexion"
                          rows="3"
                          class="w-full border rounded-lg p-3"></textarea>
            </div>

            <div class="mb-4">
                <label class="font-semibold">Imagen URL</label>
                <input type="text"
                       name="imagen_url"
                       class="w-full border rounded-lg p-3">
            </div>

            <div class="mb-4">
                <label class="font-semibold">Audio URL</label>
                <input type="text"
                       name="audio_url"
                       class="w-full border rounded-lg p-3">
            </div>

            <button type="submit"
                    class="bg-blue-700 text-white px-6 py-3 rounded-xl font-bold w-full">
                Publicar reflexión
            </button>

        </form>

    </div>

</div>

</body>
</html>
