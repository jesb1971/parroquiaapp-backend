<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Noticias</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

<h2 class="mb-4 text-center">📰 Gestión de Noticias</h2>

<!-- FORMULARIO -->
<div class="card mb-4">
    <div class="card-body">
        <h5>Crear Noticia</h5>

        <input type="text" id="titulo" class="form-control mb-2" placeholder="Título">
        <textarea id="contenido" class="form-control mb-2" placeholder="Contenido"></textarea>
        <input type="text" id="imagen" class="form-control mb-2" placeholder="URL de imagen">

        <button onclick="crearNoticia()" class="btn btn-primary w-100">
            Crear Noticia
        </button>
    </div>
</div>

<!-- LISTADO -->
<div class="card">
    <div class="card-body">
        <h5>Listado de Noticias</h5>
        <ul id="listaNoticias" class="list-group"></ul>
    </div>
</div>

<div class="mt-4 text-center">
    <a href="/admin" class="btn btn-secondary">← Volver</a>
</div>

</div>

<script>
const API_URL = "/noticias/";

async function cargarNoticias() {
    const res = await fetch(API_URL);
    const data = await res.json();

    const lista = document.getElementById("listaNoticias");
    lista.innerHTML = "";

    data.forEach(noticia => {
        const li = document.createElement("li");
        li.className = "list-group-item";

        li.innerHTML = `
            <strong>${noticia.titulo}</strong><br>
            ${noticia.contenido}<br>
            <small>${new Date(noticia.fecha).toLocaleString()}</small><br>

            <button onclick="eliminarNoticia(${noticia.id})" class="btn btn-danger btn-sm mt-2">
                Eliminar
            </button>
        `;

        lista.appendChild(li);
    });
}

async function crearNoticia() {
    const titulo = document.getElementById("titulo").value;
    const contenido = document.getElementById("contenido").value;
    const imagen = document.getElementById("imagen").value;

    if (!titulo || !contenido) {
        alert("⚠️ Completa los campos obligatorios");
        return;
    }

    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            titulo,
            contenido,
            imagen
        })
    });

    if (res.ok) {
        alert("✅ Noticia creada");

        // limpiar formulario
        document.getElementById("titulo").value = "";
        document.getElementById("contenido").value = "";
        document.getElementById("imagen").value = "";

        cargarNoticias();
    } else {
        alert("❌ Error");
    }
}

// 🔴 NUEVO: eliminar noticia
async function eliminarNoticia(id) {
    if (!confirm("¿Eliminar esta noticia?")) return;

    const res = await fetch(`/noticias/${id}`, {
        method: "DELETE"
    });

    if (res.ok) {
        alert("🗑️ Noticia eliminada");
        cargarNoticias();
    } else {
        alert("❌ Error al eliminar");
    }
}

cargarNoticias();
</script>

</body>
</html>
