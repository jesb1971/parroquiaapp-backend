<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de oraciones — Parroquia Cruz del Señor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 text-gray-800 min-h-screen">

<main class="max-w-3xl mx-auto px-4 py-6">

    <!-- CABECERA -->
    <header class="bg-white rounded-xl shadow p-5 mb-5">
        <h1 class="text-2xl font-bold text-blue-700">
            📖 Histórico de oraciones
        </h1>

        <p class="text-gray-600 text-sm mt-2">
            Un espacio para volver a las oraciones
            que nos han acompañado cada día.
        </p>

        <a href="/oracion-del-dia"
           class="inline-block mt-4 bg-blue-100 text-blue-700
                  px-4 py-2 rounded-lg font-semibold">
            ← Volver a la oración del día
        </a>
    </header>

    <!-- LISTADO -->
    <section id="listado-oraciones" class="space-y-4">
        <p class="text-center text-gray-500">
            Cargando oraciones anteriores...
        </p>
    </section>

</main>

<script>
async function cargarHistorico() {

    const listado = document.getElementById("listado-oraciones");

    try {
        const respuesta = await fetch("/oraciones/historico");

        if (!respuesta.ok) {
            throw new Error("No se pudo cargar el histórico");
        }

        const oraciones = await respuesta.json();

        listado.replaceChildren();

        const hoy = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Atlantic/Canary",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }).format(new Date());

        const anteriores = oraciones.filter(
            oracion => oracion.fecha < hoy
        );

        if (anteriores.length === 0) {
            const mensaje = document.createElement("p");
            mensaje.className =
                "bg-white rounded-xl shadow p-5 text-center text-gray-500";
            mensaje.textContent =
                "Todavía no hay oraciones anteriores.";
            listado.appendChild(mensaje);
            return;
        }

        anteriores.forEach(oracion => {

            const tarjeta = document.createElement("article");
            tarjeta.className =
                "bg-white rounded-xl shadow p-5";

            if (oracion.imagen) {
                const imagen = document.createElement("img");
                imagen.src = oracion.imagen;
                imagen.alt = "Imagen de la oración";
                imagen.className =
                    "w-full max-h-72 object-contain rounded-lg mb-4";
                tarjeta.appendChild(imagen);
            }

            const fecha = document.createElement("p");
            fecha.className = "text-sm text-gray-500 mb-2";
            fecha.textContent = new Date(
                oracion.fecha + "T12:00:00"
            ).toLocaleDateString("es-ES", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
            tarjeta.appendChild(fecha);

            const titulo = document.createElement("h2");
            titulo.className =
                "text-lg font-bold text-blue-700 mb-2";
            titulo.textContent = oracion.titulo;
            tarjeta.appendChild(titulo);

            const detalle = document.createElement("details");
            detalle.className = "mt-3";

            const resumen = document.createElement("summary");
            resumen.className =
                "cursor-pointer text-blue-600 font-semibold";
            resumen.textContent = "Leer oración completa";
            detalle.appendChild(resumen);

            const contenido = document.createElement("p");
            contenido.className =
                "mt-4 text-gray-700 leading-relaxed whitespace-pre-line";
            contenido.textContent = oracion.contenido;
            detalle.appendChild(contenido);

            if (oracion.autor) {
                const autor = document.createElement("p");
                autor.className =
                    "text-right italic text-gray-500 mt-4";
                autor.textContent = oracion.autor;
                detalle.appendChild(autor);
            }

            tarjeta.appendChild(detalle);
            listado.appendChild(tarjeta);
        });

    } catch (error) {
        listado.textContent =
            "No se pudo cargar el histórico de oraciones.";
    }
}

cargarHistorico();
</script>

</body>
</html>
