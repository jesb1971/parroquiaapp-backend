
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisos | Parroquia Cruz del Señor</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    .descripcion-aviso {
        white-space: pre-line;
        overflow-wrap: anywhere;
        line-height: 1.7;
    }
</style>
</head>

<body class="bg-gray-50 text-gray-800">

<div class="max-w-2xl mx-auto py-6 px-4">

    <!-- CABECERA -->
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-blue-700">
            📢 Avisos
        </h2>

        <a href="/app"
           class="text-sm text-gray-500 hover:underline">
            ← Volver
        </a>
    </div>

    <!-- LISTADO DE AVISOS -->
    <div id="listaAvisos" class="space-y-4"></div>

</div>

<script>
async function cargarAvisos() {
    const contenedor = document.getElementById("listaAvisos");

    try {
        const res = await fetch("/avisos/");

        if (!res.ok) {
            throw new Error("No se pudieron cargar los avisos.");
        }

        const data = await res.json();

        contenedor.replaceChildren();

        if (data.length === 0) {
            const mensaje = document.createElement("p");
            mensaje.className = "text-gray-500";
            mensaje.textContent = "No hay avisos disponibles.";
            contenedor.appendChild(mensaje);
            return;
        }

        data.forEach(aviso => {

            // TARJETA
            const tarjeta = document.createElement("article");
            tarjeta.className =
                "bg-white p-5 rounded-xl shadow-sm border border-gray-100 " +
                "cursor-pointer hover:bg-blue-50 transition";

            tarjeta.tabIndex = 0;
            tarjeta.setAttribute("role", "link");

            const abrirAviso = () => {
                window.location.href =
                    "/aviso/" + encodeURIComponent(aviso.id);
            };

            tarjeta.addEventListener("click", abrirAviso);

            tarjeta.addEventListener("keydown", (evento) => {
                if (evento.key === "Enter") {
                    abrirAviso();
                }
            });

            // TÍTULO
            const titulo = document.createElement("h3");
            titulo.className =
                "font-semibold text-lg text-blue-700 mb-2";

            titulo.textContent = aviso.titulo || "Aviso parroquial";

            // DESCRIPCIÓN
            const descripcion = document.createElement("p");
            descripcion.className =
                "descripcion-aviso text-gray-700 text-base";

            descripcion.textContent = aviso.cuerpo || "";

            // FECHA
            const fecha = document.createElement("p");
            fecha.className =
                "text-xs text-gray-400 mt-4";

            if (aviso.publicado_at) {
                const fechaAviso = new Date(aviso.publicado_at);

                if (!Number.isNaN(fechaAviso.getTime())) {
                    fecha.textContent = fechaAviso.toLocaleString("es-ES", {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                }
            }

            // INCORPORAR ELEMENTOS
            tarjeta.appendChild(titulo);
            tarjeta.appendChild(descripcion);
            tarjeta.appendChild(fecha);

            contenedor.appendChild(tarjeta);
        });

    } catch (error) {
        console.error("Error cargando avisos:", error);

        const mensaje = document.createElement("p");
        mensaje.className =
            "bg-red-50 text-red-700 p-4 rounded-lg";

        mensaje.textContent =
            "No se pudieron cargar los avisos. Inténtalo de nuevo.";

        contenedor.replaceChildren(mensaje);
    }
}

cargarAvisos();
</script>

</body>
</html>
